server:
  port: 8080
  servlet:
    context-path: /sso

spring:
  application:
    name: sso-server
  datasource:
    url: jdbc:h2:mem:sso_db;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

sso:
  jwt:
    secret: sso-secret-key-2024-sso-secret-key-2024-sso-secret-key
    expiration: 86400000
  login:
    max-attempts: 3
    captcha-enabled-after: 1
