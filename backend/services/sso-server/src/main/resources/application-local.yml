server:
  port: 8081

spring:
  autoconfigure:
    exclude:
      - net.devh.boot.grpc.server.autoconfigure.GrpcServerSecurityAutoConfiguration
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://sso.local.bw.com:8080
          jwk-set-uri: http://localhost:8081/oauth2/jwks

grpc:
  server:
    port: 9091
  client:
    user-server:
      address: static://localhost:9092

sso:
  oauth2:
    issuer-uri: http://sso.local.bw.com:8080
  web:
    login-url: http://sso.local.bw.com:8080/login
    logout-success-url: http://sso.local.bw.com:8080/login
  client:
    user-web-redirect-uri: http://admin.local.bw.com:8080/oauth2/callback
  ticket:
    expiration: 86400000

logging:
  level:
    com.sso: DEBUG
