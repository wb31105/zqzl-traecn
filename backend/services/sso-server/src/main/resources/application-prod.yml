server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/sso_prod_db;DB_CLOSE_DELAY=-1}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: ${DB_DIALECT:org.hibernate.dialect.H2Dialect}

logging:
  level:
    root: WARN
    com.zqzl.sso: INFO
    org.springframework.security: WARN
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /var/log/zqzl/sso-server.log
    max-size: 100MB
    max-history: 90
    total-size-cap: 1GB
