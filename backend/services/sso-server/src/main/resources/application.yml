server:
  port: ${SERVER_PORT}
  servlet:
    session:
      timeout: 30m
      cookie:
        name: SSO_SESSION
        http-only: true
        secure: false
        same-site: lax

spring:
  application:
    name: sso-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
  datasource:
    url: jdbc:h2:mem:sso_db;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: ${JPA_FORMAT_SQL:false}
  h2:
    console:
      enabled: true
      path: /h2-console
  thymeleaf:
    cache: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SSO_ISSUER_URI}
          jwk-set-uri: ${SSO_JWK_SET_URI}

grpc:
  server:
    port: ${GRPC_SERVER_PORT}
  client:
    user-server:
      address: static://${USER_GRPC_HOST}:${USER_GRPC_PORT}
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plaintext

sso:
  oauth2:
    issuer-uri: ${SSO_ISSUER_URI}
  web:
    login-url: ${SSO_WEB_LOGIN_URL}
    logout-success-url: ${SSO_WEB_LOGOUT_URL}
  client:
    user-web-redirect-uri: ${SSO_CLIENT_USER_WEB_REDIRECT_URI}
  ticket:
    expiration: 86400000

logging:
  level:
    com.sso: ${LOG_LEVEL_COM_SSO:INFO}
