server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        name: SSO_SESSION
        http-only: true
        secure: false
        same-site: lax

spring:
  application:
    name: sso-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:h2:mem:sso_db;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
  thymeleaf:
    cache: false

grpc:
  server:
    port: ${GRPC_SERVER_PORT:9090}
  client:
    user-server:
      address: static://${USER_GRPC_HOST:user-server}:${USER_GRPC_PORT:9091}
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plaintext

user:
  service:
    url: ${USER_SERVICE_URL:http://user-server:8081}

sso:
  oauth2:
    issuer-uri: ${SSO_ISSUER_URI:http://localhost:8080}
  web:
    login-url: ${SSO_WEB_LOGIN_URL:http://localhost:3000/login}
    logout-success-url: ${SSO_WEB_LOGOUT_URL:http://localhost:3000/login?logout}
  ticket:
    expiration: 86400000
