server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        name: SSO_SESSION
        http-only: true
        secure: false
        same-site: lax

spring:
  autoconfigure:
    exclude:
      - net.devh.boot.grpc.server.autoconfigure.GrpcServerSecurityAutoConfiguration
  application:
    name: sso-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  datasource:
    url: jdbc:h2:mem:sso_db;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: ${JPA_FORMAT_SQL:false}
  h2:
    console:
      enabled: true
      path: /h2-console
  thymeleaf:
    cache: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SSO_ISSUER_URI:http://localhost:8080}
          jwk-set-uri: ${SSO_JWK_SET_URI:http://localhost:8080/oauth2/jwks}

grpc:
  server:
    port: ${GRPC_SERVER_PORT:9090}
  client:
    user-server:
      address: static://${USER_GRPC_HOST:localhost}:${USER_GRPC_PORT:9091}
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plaintext

sso:
  oauth2:
    issuer-uri: ${SSO_ISSUER_URI:http://localhost:8080}
  web:
    login-url: ${SSO_WEB_LOGIN_URL:http://localhost:8080/login}
    logout-success-url: ${SSO_WEB_LOGOUT_URL:http://localhost:8080/login?logout}
  client:
    user-web-redirect-uri: ${SSO_CLIENT_USER_WEB_REDIRECT_URI:http://localhost:3002/oauth2/callback}
  ticket:
    expiration: 86400000

logging:
  level:
    com.sso: ${LOG_LEVEL_COM_SSO:INFO}
