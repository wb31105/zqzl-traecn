server:
  servlet:
    context-path: /user
  port: 8081

spring:
  application:
    name: user-server
  profiles:
    active: dev

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

user:
  jwt:
    secret: user-secret-key-2024-user-secret-key-2024-user-secret-key
    expiration: 86400000
  login:
    max-attempts: 3
    captcha-enabled-after: 1
