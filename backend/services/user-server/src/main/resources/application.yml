server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: user-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:h2:mem:userdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

grpc:
  server:
    port: ${GRPC_SERVER_PORT:9091}
  client:
    sso-server:
      address: static://${SSO_GRPC_HOST:sso-server}:${SSO_GRPC_PORT:9090}
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plaintext

sso:
  service:
    url: ${SSO_SERVICE_URL:http://sso-server:8080}

user:
  jwt:
    secret: user-secret-key-2024-user-secret-key-2024-user-secret-key
    expiration: 86400000
  login:
    max-attempts: 3
    captcha-enabled-after: 1
