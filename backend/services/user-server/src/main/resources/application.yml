server:
  port: ${SERVER_PORT:8080}

spring:
  autoconfigure:
    exclude:
      - net.devh.boot.grpc.server.autoconfigure.GrpcServerSecurityAutoConfiguration
  application:
    name: user-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  datasource:
    url: jdbc:h2:mem:userdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:false}
  h2:
    console:
      enabled: true
      path: /h2-console
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SSO_ISSUER_URI:http://localhost:8080}
          jwk-set-uri: ${SSO_JWK_SET_URI:http://localhost:8080/oauth2/jwks}

grpc:
  server:
    port: ${GRPC_SERVER_PORT:9091}
  client:
    sso-server:
      address: static://${SSO_GRPC_HOST:localhost}:${SSO_GRPC_PORT:9090}
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plaintext

sso:
  oauth2:
    client-id: user-web-client
    client-secret: user-web-secret-123
    token-uri: ${SSO_TOKEN_URI:http://localhost:8080/oauth2/token}
    authorization-uri: ${SSO_AUTHORIZATION_URI:http://localhost:8080/oauth2/authorize}
    redirect-uri: ${SSO_REDIRECT_URI:http://localhost:3002/oauth2/callback}
    scope: ${SSO_OAUTH2_SCOPE:profile read write}

user:
  jwt:
    secret: ${USER_JWT_SECRET:my-super-secret-key-for-jwt-token-generation-at-least-256-bits-long}
    expiration: ${USER_JWT_EXPIRATION:86400000}
  login:
    max-attempts: 3
    captcha-enabled-after: 1

logging:
  level:
    com.user: ${LOG_LEVEL_COM_USER:INFO}
    org.hibernate.SQL: ${LOG_LEVEL_HIBERNATE_SQL:INFO}
