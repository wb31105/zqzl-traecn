server:
  port: ${SERVER_PORT}

spring:
  autoconfigure:
    exclude:
      - net.devh.boot.grpc.server.autoconfigure.GrpcServerSecurityAutoConfiguration
  application:
    name: user-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
  datasource:
    url: jdbc:h2:mem:userdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:false}
  h2:
    console:
      enabled: true
      path: /h2-console
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SSO_ISSUER_URI}
          jwk-set-uri: ${SSO_JWK_SET_URI}

grpc:
  server:
    port: ${GRPC_SERVER_PORT}
  client:
    sso-server:
      address: static://${SSO_GRPC_HOST}:${SSO_GRPC_PORT}
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plaintext

sso:
  oauth2:
    client-id: user-web-client
    client-secret: user-web-secret-123
    token-uri: ${SSO_TOKEN_URI}
    authorization-uri: ${SSO_AUTHORIZATION_URI}
    redirect-uri: ${SSO_REDIRECT_URI}
    scope: ${SSO_OAUTH2_SCOPE}

user:
  login:
    max-attempts: 3
    captcha-enabled-after: 1

logging:
  level:
    com.user: ${LOG_LEVEL_COM_USER:INFO}
    org.hibernate.SQL: ${LOG_LEVEL_HIBERNATE_SQL:INFO}
