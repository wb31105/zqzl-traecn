services:
  user-server:
    image: ${USER_SERVER_IMAGE}
    container_name: ${PROJECT_NAME}-user-server
    environment:
      - SPRING_PROFILES_ACTIVE=${USER_SERVER_PROFILE}
      - SERVER_PORT=${USER_SERVER_PORT}
      - GRPC_SERVER_PORT=${USER_SERVER_GRPC_PORT}
      - SSO_GRPC_HOST=${SSO_GRPC_HOST}
      - SSO_GRPC_PORT=${SSO_GRPC_PORT}
      - SSO_ISSUER_URI=${USER_SSO_ISSUER_URI}
      - SSO_JWK_SET_URI=${USER_SSO_JWK_SET_URI}
      - SSO_TOKEN_URI=${SSO_TOKEN_URI}
      - SSO_AUTHORIZATION_URI=${SSO_AUTHORIZATION_URI}
      - SSO_REDIRECT_URI=${SSO_REDIRECT_URI}
      - SSO_OAUTH2_SCOPE=${SSO_OAUTH2_SCOPE}
      - REACT_APP_SSO_SERVER_URL=${REACT_APP_SSO_SERVER_URL}
      - REACT_APP_API_SERVER_URL=${REACT_APP_API_SERVER_URL}
      - REACT_APP_USER_WEB_URL=${REACT_APP_USER_WEB_URL}
      - REACT_APP_OAUTH2_AUTH_URI=${REACT_APP_OAUTH2_AUTH_URI}
      - REACT_APP_OAUTH2_CLIENT_ID=${REACT_APP_OAUTH2_CLIENT_ID}
      - REACT_APP_OAUTH2_REDIRECT_URI=${REACT_APP_OAUTH2_REDIRECT_URI}
      - REACT_APP_OAUTH2_SCOPE=${REACT_APP_OAUTH2_SCOPE}
    networks:
      - ${NETWORK_NAME}
    restart: unless-stopped
