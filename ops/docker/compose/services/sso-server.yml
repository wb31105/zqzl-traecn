services:
  sso-server:
    image: ${SSO_SERVER_IMAGE}
    container_name: ${PROJECT_NAME}-sso-server
    depends_on:
      user-server:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=${SSO_SERVER_PROFILE}
      - SERVER_PORT=${SSO_SERVER_PORT}
      - GRPC_SERVER_PORT=${SSO_SERVER_GRPC_PORT}
      - USER_GRPC_HOST=${USER_GRPC_HOST}
      - USER_GRPC_PORT=${USER_GRPC_PORT}
      - SSO_ISSUER_URI=${SSO_ISSUER_URI}
      - SSO_JWK_SET_URI=${SSO_JWK_SET_URI}
      - SSO_WEB_LOGIN_URL=${SSO_WEB_LOGIN_URL}
      - SSO_WEB_LOGOUT_URL=${SSO_WEB_LOGOUT_URL}
      - SSO_CLIENT_USER_WEB_REDIRECT_URI=${SSO_CLIENT_USER_WEB_REDIRECT_URI}
      - REACT_APP_SSO_SERVER_URL=${REACT_APP_SSO_SERVER_URL}
      - REACT_APP_API_SERVER_URL=${REACT_APP_API_SERVER_URL}
      - REACT_APP_USER_WEB_URL=${REACT_APP_USER_WEB_URL}
      - REACT_APP_OAUTH2_AUTH_URI=${REACT_APP_OAUTH2_AUTH_URI}
      - REACT_APP_OAUTH2_CLIENT_ID=${REACT_APP_OAUTH2_CLIENT_ID}
      - REACT_APP_OAUTH2_REDIRECT_URI=${REACT_APP_OAUTH2_REDIRECT_URI}
      - REACT_APP_OAUTH2_SCOPE=${REACT_APP_OAUTH2_SCOPE}
    networks:
      - ${NETWORK_NAME}
    restart: unless-stopped
