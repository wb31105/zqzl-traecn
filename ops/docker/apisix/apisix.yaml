routes:
  - id: sso-server-route
    uri: /v1/auth/*
    priority: 10
    plugins:
      proxy-rewrite:
        regex_uri: ["^/v1/auth/(.*)", "/sso/v1/auth/$1"]
    upstream:
      type: roundrobin
      nodes:
        "sso-server:8080": 1

  - id: user-server-route
    uri: /v1/users/*
    priority: 9
    plugins:
      proxy-rewrite:
        regex_uri: ["^/v1/users/(.*)", "/v1/users/$1"]
    upstream:
      type: roundrobin
      nodes:
        "user-server:8080": 1

  - id: user-web-root-route
    uri: /user
    priority: 8
    plugins:
      proxy-rewrite:
        regex_uri: ["^/user$", "/"]
    upstream:
      type: roundrobin
      nodes:
        "user-web:80": 1

  - id: user-web-all-route
    uri: /user/*
    priority: 7
    plugins:
      proxy-rewrite:
        regex_uri: ["^/user/(.*)", "/$1"]
    upstream:
      type: roundrobin
      nodes:
        "user-web:80": 1

  - id: sso-web-catchall-route
    uri: /*
    priority: 1
    upstream:
      type: roundrobin
      nodes:
        "sso-web:80": 1

#END
