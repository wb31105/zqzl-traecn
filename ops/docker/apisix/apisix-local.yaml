routes:
  - id: local-api-sso-server-route
    uri: /v1/auth/*
    priority: 100
    plugins:
      proxy-rewrite:
        regex_uri: ["^/v1/auth/(.*)", "/sso/v1/auth/$1"]
    upstream:
      type: roundrobin
      nodes:
        "localhost:8081": 1

  - id: local-api-oauth2-route
    uri: /oauth2/*
    priority: 99
    upstream:
      type: roundrobin
      nodes:
        "localhost:8081": 1

  - id: local-api-user-server-route
    uri: /v1/users/*
    priority: 98
    upstream:
      type: roundrobin
      nodes:
        "localhost:8082": 1

  - id: local-sso-web-route
    uri: /*
    priority: 50
    host: localhost
    vars: [["server_port", "==", "8080"]]
    upstream:
      type: roundrobin
      nodes:
        "localhost:3001": 1

#END
