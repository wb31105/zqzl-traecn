version: '3.8'

services:
  eureka-server:
    image: zqzl/eureka-server:latest
    container_name: zqzl-eureka-server
    ports:
      - "8761:8761"
    networks:
      - zqzl-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/eureka/apps"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  gateway-server:
    image: zqzl/gateway-server:latest
    container_name: zqzl-gateway-server
    ports:
      - "9000:9000"
    depends_on:
      eureka-server:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    networks:
      - zqzl-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  user-server:
    image: zqzl/user-server:latest
    container_name: zqzl-user-server
    ports:
      - "8081:8081"
    depends_on:
      eureka-server:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    networks:
      - zqzl-network
    restart: unless-stopped

  sso-server:
    image: zqzl/sso-server:latest
    container_name: zqzl-sso-server
    ports:
      - "8080:8080"
    depends_on:
      eureka-server:
        condition: service_healthy
      user-server:
        condition: service_started
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - USER_SERVICE_URL=http://user-server:8081
    networks:
      - zqzl-network
    restart: unless-stopped

  sso-web:
    image: zqzl/sso-web:latest
    container_name: zqzl-sso-web
    ports:
      - "3000:80"
    networks:
      - zqzl-network
    depends_on:
      - sso-server
    restart: unless-stopped

  user-web:
    image: zqzl/user-web:latest
    container_name: zqzl-user-web
    ports:
      - "3031:80"
    networks:
      - zqzl-network
    depends_on:
      - user-server
    restart: unless-stopped

  nginx-gateway:
    image: zqzl/nginx-gateway:latest
    container_name: zqzl-nginx-gateway
    ports:
      - "80:80"
    depends_on:
      - sso-web
      - user-web
      - gateway-server
    networks:
      - zqzl-network
    restart: unless-stopped

networks:
  zqzl-network:
    driver: bridge
    name: zqzl-network
