version: '3.8'

services:
  etcd:
    image: bitnami/etcd:3.5.9
    container_name: zqzl-etcd
    ports:
      - "2379:2379"
      - "2380:2380"
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
    networks:
      - zqzl-network
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  apisix:
    image: zqzl/apisix-gateway:latest
    container_name: zqzl-apisix-gateway
    ports:
      - "80:9080"
      - "443:9443"
      - "9180:9180"
    depends_on:
      etcd:
        condition: service_healthy
      sso-web:
        condition: service_started
      user-web:
        condition: service_started
      sso-server:
        condition: service_started
      user-server:
        condition: service_started
    networks:
      - zqzl-network
    restart: unless-stopped

  user-server:
    image: zqzl/user-server:latest
    container_name: zqzl-user-server
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8080
      - GRPC_SERVER_PORT=9091
      - SSO_GRPC_HOST=sso-server
      - SSO_GRPC_PORT=9090
    networks:
      - zqzl-network
    restart: unless-stopped

  sso-server:
    image: zqzl/sso-server:latest
    container_name: zqzl-sso-server
    ports:
      - "8080:8080"
    depends_on:
      user-server:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8080
      - GRPC_SERVER_PORT=9090
      - USER_GRPC_HOST=user-server
      - USER_GRPC_PORT=9091
    networks:
      - zqzl-network
    restart: unless-stopped

  sso-web:
    image: zqzl/sso-web:latest
    container_name: zqzl-sso-web
    ports:
      - "3000:80"
    networks:
      - zqzl-network
    depends_on:
      - sso-server
    restart: unless-stopped

  user-web:
    image: zqzl/user-web:latest
    container_name: zqzl-user-web
    ports:
      - "3031:80"
    networks:
      - zqzl-network
    depends_on:
      - user-server
    restart: unless-stopped

networks:
  zqzl-network:
    driver: bridge
    name: zqzl-network
